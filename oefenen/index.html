<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>VGT-oefenen · InterventionAssistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Nunito+Sans:wght@300;400;600;700&display=swap">
<style>
/* InterventionAssistant-huisstijl: witte nav met blauwe onderrand, blauwe hero, kaarten met kleurstreep, accordions.
   Tokens volgen style.css van interventionassistant.com zodat dit later als sectie in de site past. */
:root {
  --blue:#1e6db5; --blue-light:#ddeaf7; --blue-mid:#b9d3ee;
  --teal:#138a8a; --teal-light:#d4eeee;
  --red:#b53a2f; --red-light:#f5dedd;
  --purple:#6040a0; --purple-light:#ece8f7;
  --orange:#b36000; --orange-light:#fdebd3;
  --green:#1a7a3e; --green-light:#d9f0e1;
  --text:#1a1a2a; --muted:#5a6378; --border:#cdd3de; --hair:#edf0f5;
  --bg:#e8eaef; --card:#f2f4f8; --white:#f8f9fc;
  --hero-a:#1a5c9e; --hero-b:#154f8a; --hero-accent:#7de8e8; --on-accent:#ffffff;
  --font-head:'Nunito', 'Segoe UI', system-ui, sans-serif;
  --font-body:'Nunito Sans', 'Segoe UI', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --blue:#6aaae4; --blue-light:#1c2b3e; --blue-mid:#2a4566;
    --teal:#45b8b8; --teal-light:#14302f; --red:#e2756c; --red-light:#3a2220;
    --purple:#a98fe3; --purple-light:#292240; --orange:#e0a050; --orange-light:#362a17;
    --green:#5cc287; --green-light:#17301f;
    --text:#e6e9f2; --muted:#9aa3b8; --border:#3a4152; --hair:#2c3241;
    --bg:#14161c; --card:#1d212a; --white:#242938;
    --hero-a:#173b63; --hero-b:#122f50; --hero-accent:#7de8e8; --on-accent:#10131a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --blue:#6aaae4; --blue-light:#1c2b3e; --blue-mid:#2a4566;
  --teal:#45b8b8; --teal-light:#14302f; --red:#e2756c; --red-light:#3a2220;
  --purple:#a98fe3; --purple-light:#292240; --orange:#e0a050; --orange-light:#362a17;
  --green:#5cc287; --green-light:#17301f;
  --text:#e6e9f2; --muted:#9aa3b8; --border:#3a4152; --hair:#2c3241;
  --bg:#14161c; --card:#1d212a; --white:#242938;
  --hero-a:#173b63; --hero-b:#122f50; --hero-accent:#7de8e8; --on-accent:#10131a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; font-family: var(--font-body); background: var(--bg); color: var(--text); font-size: 16px; line-height: 1.5; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
a { color: var(--blue); }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* NAV */
nav.ia { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 200; background: var(--white); border-bottom: 3px solid var(--blue); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 210; background: var(--white); }
.nav-in { max-width: 980px; margin: 0 auto; height: 58px; display: flex; align-items: center; gap: 0.2rem; }
.logo { font-family: var(--font-head); font-weight: 800; font-size: 1.05rem; color: var(--blue); text-decoration: none; white-space: nowrap; margin-right: 0.6rem; background: none; border: 0; padding: 0; }
.logo span { color: var(--teal); }
.logo small { font-family: var(--font-body); font-weight: 600; font-size: 0.72rem; color: var(--muted); margin-left: 0.4rem; }
.nav-btn { background: none; border: none; font-size: 0.8rem; font-weight: 600; color: var(--muted); padding: 0.4rem 0.7rem; border-radius: 5px; white-space: nowrap; }
.nav-btn:hover, .nav-btn.on { background: var(--blue-light); color: var(--blue); }
.nav-right { margin-left: auto; display: flex; align-items: center; gap: 0.35rem; }
.chip-btn { background: none; border: 1.5px solid var(--border); border-radius: 5px; padding: 0.28rem 0.55rem; font-size: 0.72rem; font-weight: 700; color: var(--muted); font-family: var(--font-head); }
.chip-btn:hover { border-color: var(--blue); color: var(--blue); }
.xp-mini { font-family: var(--font-head); font-weight: 800; font-size: 0.75rem; color: var(--teal); background: var(--teal-light); border-radius: 20px; padding: 0.2rem 0.6rem; white-space: nowrap; }
@media (max-width: 620px) { .logo small { display: none; } .nav-btn { padding: 0.4rem 0.45rem; } .xp-mini { display: none; } .nav-in { height: 52px; } }
@media (max-width: 440px) { .nav-in { gap: 0.05rem; } .logo { font-size: 0.86rem; margin-right: 0.15rem; } .nav-btn { font-size: 0.72rem; padding: 0.35rem 0.3rem; } .chip-btn { padding: 0.25rem 0.4rem; } .nav-right { gap: 0.25rem; } .qhead .tag { display: none; } }
@media (max-width: 350px) { .logo span { display: none; } }

/* HERO */
.hero { background: linear-gradient(120deg, var(--hero-a) 0%, var(--hero-b) 100%); color: #fff; padding-block: 2.2rem 2rem; }
.hero-in { max-width: 880px; margin: 0 auto; display: flex; flex-direction: column; gap: 1.1rem; }
.hero h1 { font-family: var(--font-head); font-weight: 800; font-size: 2rem; margin: 0; line-height: 1.15; text-align: center; }
.hero h1 span { color: var(--hero-accent); }
.hero p.sub { margin: 0; text-align: center; font-size: 0.9rem; opacity: 0.85; }
.hero-stats { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 0.75rem; }
.hstat { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.18); border-radius: 10px; padding: 0.75rem 0.9rem; min-width: 0; }
.hstat .lbl { font-size: 0.66rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.8; }
.hstat .val { font-family: var(--font-head); font-weight: 800; font-size: 1.25rem; line-height: 1.2; }
.hstat .val small { font-size: 0.78rem; font-weight: 700; opacity: 0.8; }
.bar { height: 7px; border-radius: 6px; background: rgba(255,255,255,0.2); overflow: hidden; margin-top: 0.4rem; }
.bar span { display: block; height: 100%; background: var(--hero-accent); border-radius: 6px; transition: width .4s ease; }
@media (max-width: 620px) { .hero h1 { font-size: 1.6rem; } .hero-stats { grid-template-columns: 1fr 1fr; } .hstat.level { grid-column: 1 / -1; } .hero { padding-block: 1.6rem 1.4rem; } }

/* MAIN */
.main { max-width: 880px; margin: 0 auto; padding-block: 1.5rem 2rem; display: flex; flex-direction: column; gap: 1rem; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
@media (max-width: 760px) { .grid2 { grid-template-columns: 1fr; } }
.card { background: var(--white); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.06); min-width: 0; display: flex; flex-direction: column; }
.stripe { height: 4px; flex: none; }
.stripe.blue { background: var(--blue); } .stripe.teal { background: var(--teal); } .stripe.red { background: var(--red); } .stripe.purple { background: var(--purple); } .stripe.orange { background: var(--orange); } .stripe.green { background: var(--green); }
.card-head { padding: 0.9rem 1.1rem 0.4rem; display: flex; gap: 0.75rem; align-items: flex-start; }
.icon { width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; font-size: 1.05rem; flex: none; }
.icon.blue { background: var(--blue-light); } .icon.teal { background: var(--teal-light); } .icon.red { background: var(--red-light); } .icon.purple { background: var(--purple-light); } .icon.orange { background: var(--orange-light); }
.card-title { font-family: var(--font-head); font-weight: 800; font-size: 0.95rem; }
.card-sub { font-size: 0.75rem; color: var(--muted); margin-top: 0.1rem; }
.card-body { padding: 0.5rem 1.1rem 1.1rem; display: flex; flex-direction: column; gap: 0.75rem; flex: 1; }
.field { display: flex; flex-direction: column; gap: 0.3rem; }
.flabel { font-size: 0.66rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
select, input[type=date], input[type=number] { font: inherit; font-size: 0.86rem; color: var(--text); background: var(--bg); border: 1.5px solid var(--border); border-radius: 8px; padding: 0.45rem 0.7rem; width: 100%; min-width: 0; }
select:focus, input:focus { border-color: var(--blue); outline: none; }
.seg { display: flex; flex-wrap: wrap; gap: 0.35rem; }
.seg button, .seg input { width: 3.3rem; padding: 0.35rem 0; text-align: center; border: 1.5px solid var(--border); background: var(--bg); border-radius: 20px; font-weight: 700; font-size: 0.8rem; color: var(--muted); font-family: var(--font-head); }
.seg input { width: 4.6rem; padding-inline: 0.4rem; font-family: var(--font-body); }
.seg .on { border-color: var(--blue); background: var(--blue-light); color: var(--blue); }
.check { display: inline-flex; gap: 0.5rem; align-items: center; font-size: 0.86rem; cursor: pointer; }
.check input { width: 17px; height: 17px; accent-color: var(--teal); margin: 0; }
.btn { border: 1.5px solid var(--border); background: var(--white); border-radius: 8px; padding: 0.55rem 1rem; font-family: var(--font-head); font-weight: 800; font-size: 0.86rem; color: var(--text); }
.btn:hover:not(:disabled) { border-color: var(--blue); color: var(--blue); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn.teal { background: var(--teal); border-color: var(--teal); color: var(--on-accent); }
.btn.blue { background: var(--blue); border-color: var(--blue); color: var(--on-accent); }
.btn.red { background: var(--red); border-color: var(--red); color: var(--on-accent); }
.btn.teal:hover:not(:disabled), .btn.blue:hover:not(:disabled), .btn.red:hover:not(:disabled) { filter: brightness(1.08); color: var(--on-accent); }
.btn.wide { width: 100%; padding-block: 0.75rem; font-size: 0.95rem; }
.btn.pill { border-radius: 25px; }
.row { display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: center; }
.spacer { flex: 1; }
.small { font-size: 0.78rem; }
.tag { font-size: 0.66rem; font-weight: 800; padding: 0.15rem 0.5rem; border-radius: 20px; white-space: nowrap; }
.tag.blue { background: var(--blue-light); color: var(--blue); } .tag.teal { background: var(--teal-light); color: var(--teal); } .tag.red { background: var(--red-light); color: var(--red); } .tag.purple { background: var(--purple-light); color: var(--purple); } .tag.orange { background: var(--orange-light); color: var(--orange); } .tag.green { background: var(--green-light); color: var(--green); }
.bigfig { font-family: var(--font-head); font-weight: 800; font-size: 1.7rem; line-height: 1.1; }
.ring { --p: 0; width: 64px; height: 64px; border-radius: 50%; background: conic-gradient(var(--teal) calc(var(--p) * 1%), var(--hair) 0); display: grid; place-items: center; flex: none; }
.ring b { width: 50px; height: 50px; border-radius: 50%; background: var(--white); display: grid; place-items: center; font-family: var(--font-head); font-size: 0.85rem; }
.list { border-top: 1px solid var(--hair); }
.li { display: flex; align-items: center; gap: 0.6rem; padding: 0.5rem 0; border-bottom: 1px solid var(--hair); font-size: 0.84rem; min-width: 0; }
.li:last-child { border-bottom: 0; }
.li .grow { flex: 1; min-width: 0; overflow-wrap: anywhere; }

/* ACCORDION */
.accordion { }
.acc-header { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; padding: 0.85rem 1.1rem; background: var(--white); border: 1px solid var(--border); border-radius: 8px; text-align: left; }
.acc-header:hover { background: var(--card); }
.accordion.open .acc-header { border-radius: 8px 8px 0 0; border-bottom: none; }
.acc-title-wrap { display: flex; align-items: center; gap: 0.65rem; }
.acc-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.acc-dot.blue { background: var(--blue); } .acc-dot.teal { background: var(--teal); } .acc-dot.red { background: var(--red); } .acc-dot.purple { background: var(--purple); } .acc-dot.green { background: var(--green); } .acc-dot.orange { background: var(--orange); }
.acc-title { font-family: var(--font-head); font-weight: 700; font-size: 0.9rem; }
.acc-chevron { font-size: 0.68rem; color: var(--muted); transition: transform .2s; }
.accordion.open .acc-chevron { transform: rotate(180deg); }
.acc-body { display: none; background: var(--white); border: 1px solid var(--border); border-top: none; border-radius: 0 0 8px 8px; padding: 0.9rem 1.1rem; }
.accordion.open .acc-body { display: block; }

/* mastery */
.mast { display: grid; grid-template-columns: minmax(0, 9rem) minmax(0, 1fr) 3.2rem; gap: 0.6rem; align-items: center; padding: 0.35rem 0; border-bottom: 1px solid var(--hair); font-size: 0.84rem; }
.mast:last-child { border-bottom: 0; }
.mbar { height: 8px; background: var(--hair); border-radius: 6px; overflow: hidden; }
.mbar span { display: block; height: 100%; border-radius: 6px; background: var(--blue); }
.mbar span.t1 { background: var(--orange); } .mbar span.t2 { background: var(--blue); } .mbar span.t3 { background: var(--teal); } .mbar span.t4 { background: var(--green); }
/* badges */
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 0.6rem; }
.badge { border: 1px solid var(--border); border-radius: 10px; padding: 0.6rem 0.7rem; display: flex; gap: 0.55rem; align-items: center; background: var(--card); min-width: 0; }
.badge .b-ic { font-size: 1.35rem; width: 2rem; text-align: center; flex: none; }
.badge .b-t { font-family: var(--font-head); font-weight: 800; font-size: 0.8rem; }
.badge .b-d { font-size: 0.7rem; color: var(--muted); line-height: 1.3; }
.badge.locked { opacity: 0.45; filter: grayscale(1); }
/* heatmap */
.heat { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 12px); gap: 3px; overflow-x: auto; padding-bottom: 4px; }
.heat i { width: 12px; height: 12px; border-radius: 3px; background: var(--hair); display: block; }
.heat i.l1 { background: var(--teal-light); } .heat i.l2 { background: color-mix(in srgb, var(--teal) 45%, var(--teal-light)); } .heat i.l3 { background: color-mix(in srgb, var(--teal) 75%, var(--teal-light)); } .heat i.l4 { background: var(--teal); }
.heat i.today { outline: 1.5px solid var(--blue); }

/* SESSION */
.qhead { background: var(--white); border: 1px solid var(--border); border-radius: 10px; padding: 0.75rem 1rem; display: flex; flex-direction: column; gap: 0.55rem; box-shadow: 0 1px 4px rgba(0,0,0,0.05); position: sticky; top: calc(env(safe-area-inset-top, 0px) + 61px); z-index: 50; }
@media (max-width: 620px) { .qhead { top: calc(env(safe-area-inset-top, 0px) + 55px); } }
.qtrack { height: 6px; background: var(--hair); border-radius: 6px; overflow: hidden; }
.qtrack span { display: block; height: 100%; background: var(--teal); transition: width .25s; }
.combo { font-family: var(--font-head); font-weight: 800; font-size: 0.8rem; color: var(--orange); }
.qcard { background: var(--white); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.06); display: flex; }
.qbar { width: 5px; flex: none; }
.qinner { padding: 1.1rem 1.2rem 1.2rem; display: flex; flex-direction: column; gap: 0.95rem; min-width: 0; flex: 1; }
.qmeta { display: flex; flex-wrap: wrap; gap: 0.4rem; align-items: center; }
.stem { font-family: var(--font-head); font-weight: 700; font-size: 1.08rem; line-height: 1.45; margin: 0; white-space: pre-line; overflow-wrap: anywhere; }
.opts { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.45rem; }
.opt { width: 100%; display: flex; gap: 0.75rem; align-items: center; text-align: left; padding: 0.6rem 0.8rem; background: var(--card); border: 1.5px solid var(--border); border-radius: 8px; font-size: 0.92rem; }
.opt:hover:not(:disabled) { border-color: var(--blue); background: var(--blue-light); }
.opt:disabled { cursor: default; }
.sn { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; flex: none; font-family: var(--font-head); font-weight: 800; font-size: 0.75rem; background: var(--blue); color: var(--on-accent); }
.opt .txt { min-width: 0; overflow-wrap: anywhere; }
.opt.right { border-color: var(--green); background: var(--green-light); }
.opt.right .sn { background: var(--green); }
.opt.right .txt { font-weight: 700; color: var(--green); }
.opt.wrong { border-color: var(--red); background: var(--red-light); }
.opt.wrong .sn { background: var(--red); }
.opt.wrong .txt { color: var(--red); text-decoration: line-through; }
.opt.dim { opacity: 0.55; }
.note { border-left: 3px solid var(--border); padding: 0.75rem 0.95rem; border-radius: 0 8px 8px 0; background: var(--card); display: flex; flex-direction: column; gap: 0.6rem; font-size: 0.9rem; line-height: 1.55; }
.note.ok { border-color: var(--green); background: var(--green-light); }
.note.bad { border-color: var(--red); background: var(--red-light); }
.verdict { font-family: var(--font-head); font-weight: 800; font-size: 0.98rem; display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; }
.note.ok .verdict { color: var(--green); } .note.bad .verdict { color: var(--red); }
.xpgain { font-size: 0.75rem; font-weight: 800; color: var(--teal); background: var(--white); border-radius: 20px; padding: 0.1rem 0.5rem; }
.etext { margin: 0; white-space: pre-line; overflow-wrap: anywhere; }
.flagnote { margin: 0; font-size: 0.8rem; color: var(--muted); font-style: italic; }
.links { margin: 0; font-size: 0.82rem; color: var(--muted); overflow-wrap: anywhere; }
.links a { font-weight: 700; text-decoration: none; }
.links a:hover { text-decoration: underline; }
.hint { font-size: 0.74rem; color: var(--muted); }
.model { font-weight: 700; padding: 0.6rem 0.9rem; border-left: 3px solid var(--blue); background: var(--blue-light); border-radius: 0 8px 8px 0; white-space: pre-line; }
/* figuren */
.figwrap { display: flex; flex-direction: column; gap: 0.25rem; }
.figs { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 0.5rem; }
.figs.single { grid-template-columns: minmax(0, 1fr); }
.fig { margin: 0; position: relative; background: #000; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); min-width: 0; }
.fig button { display: block; width: 100%; padding: 0; border: 0; background: none; cursor: zoom-in; }
.fig img { display: block; width: 100%; height: auto; max-height: 470px; object-fit: contain; background: #000; }
.fig figcaption { position: absolute; left: 6px; top: 6px; font-weight: 800; font-size: 0.8rem; background: rgba(0,0,0,.65); color: #fff; padding: 1px 7px; border-radius: 4px; }
.credit { font-size: 0.7rem; color: var(--muted); overflow-wrap: anywhere; text-decoration: none; }
.lightbox { position: fixed; inset: 0; z-index: 1000; background: rgba(0,0,0,.88); display: flex; align-items: center; justify-content: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); cursor: zoom-out; }
.lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 8px; }
.lightbox .close { position: absolute; top: max(12px, env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); background: none; border: 0; color: #fff; font-size: 1.5rem; }
/* resultaat */
.resgrid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 0.75rem; }
@media (max-width: 520px) { .resgrid { grid-template-columns: 1fr 1fr; } }
.rstat { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 0.7rem 0.85rem; }
.rstat .lbl { font-size: 0.66rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.unlock { border: 1.5px solid var(--orange); background: var(--orange-light); border-radius: 10px; padding: 0.7rem 0.9rem; display: flex; gap: 0.7rem; align-items: center; }
.unlock .b-ic { font-size: 1.6rem; }
details.rev { border: 1px solid var(--border); border-radius: 8px; background: var(--white); }
details.rev summary { padding: 0.7rem 1rem; cursor: pointer; font-weight: 600; font-size: 0.88rem; overflow-wrap: anywhere; }
details.rev .inner { padding: 0 1rem 0.9rem; display: flex; flex-direction: column; gap: 0.5rem; font-size: 0.88rem; }
.foot { max-width: 880px; margin: 0 auto; padding-block: 1rem 2.2rem; border-top: 1px solid var(--border); text-align: center; font-size: 0.76rem; color: var(--muted); line-height: 1.6; display: flex; flex-direction: column; gap: 0.4rem; align-items: center; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--blue); font-weight: 700; text-decoration: underline; font-size: inherit; }
